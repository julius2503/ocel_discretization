<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>OCEL Attributes Configuration</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />

        <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
        <script src="https://unpkg.com/htmx.org@2.0.4/dist/ext/json-enc.js" defer></script>

        <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

        <script>
            window.initialAttributes = {{ attributes | tojson }};
        </script>
        <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
    </head>
    <body>
        <div class="container my-5">
            <h1 class="mb-3 text-center">OCEL: {{ filename }}</h1>
            <div class="mb-5">
                <a href="{{ url_for('upload_file') }}" class="btn btn-secondary">Start New Analysis</a>
            </div>
            <form method="post" action="/process" x-data="discretizationForm()" @submit.prevent="submitForm">
                <div class="card mb-5 shadow-sm border-0">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="mb-0">
                            <i class="bi bi-table"></i>
                            Attribute
                        </h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="text-center">Select</th>
                                        <th>Attribute</th>
                                        <th>Type</th>
                                        <th>Qualifier</th>
                                        <th class="text-center">Numeric</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="attr in data.attributes" :key="index">
                                        <tr>
                                            <td class="text-center">
                                                <input type="checkbox" class="form-check-input" x-model="attr.selected" />
                                            </td>
                                            <td>
                                                <span x-text="attr.attribute"></span>
                                            </td>
                                            <td>
                                                <span x-text="attr.type"></span>
                                            </td>
                                            <td>
                                                <span x-text="attr.qualifier"></span>
                                            </td>
                                            <td class="text-center">
                                                <input type="checkbox" class="form-check-input" x-model="attr.numeric" />
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="card mb-4 shadow border-primary border-2">
                    <div class="card-header bg-primary bg-opacity-75 text-white">
                        <strong>
                            <i class="bi bi-hash"></i>
                            Object Aggregation
                        </strong>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-sm table-bordered mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Attribute</th>
                                    <th>Type</th>
                                    <th>Qualifier</th>
                                    <th>Aggregation</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="(attr, idx) in data.attributes.filter(a => a.type==='OBJECT' && a.numeric)" :key="idx">
                                    <tr>
                                        <td x-text="attr.attribute"></td>
                                        <td x-text="attr.type"></td>
                                        <td x-text="attr.qualifier"></td>
                                        <td>
                                            <select x-model="attr.aggregation" class="form-select form-select-sm" @change="onAggregationChange(data.attributes, attr)">
                                                <option value="">None</option>
                                                <option value="sum">Sum</option>
                                                <option value="mean">Mean</option>
                                                <option value="median">Median</option>
                                                <option value="min">Minimum</option>
                                                <option value="max">Maximum</option>
                                                <option value="count">Count</option>
                                            </select>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

                <template
                    x-for="(attr, idx) in data.attributes.filter(a => a.numeric)"
                    :key="'numeric-card-' + idx"
                    x-init="attr.algorithm.parameters = JSON.parse(JSON.stringify(defaultParameters[attr.algorithm.name]))"
                >
                    <div class="card mb-4 shadow border-primary border-2">
                        <div class="card-header bg-primary bg-opacity-75 text-white">
                            <strong>
                                <i class="bi bi-hash"></i>
                                Settings for Numeric Attribute
                                <span x-text="attr.attribute"></span>
                            </strong>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <h6 class="mb-2 text-secondary">Algorithm</h6>
                                <div class="card-body">
                                    <select
                                        class="form-select mb-3"
                                        x-model="attr.algorithm.name"
                                        @change="attr.algorithm.parameters = JSON.parse(JSON.stringify(defaultParameters[attr.algorithm.name]))"
                                    >
                                        <option value="equal-freq">Equal-Frequency Binning</option>
                                        <option value="equal-width">Equal-Width Binning</option>
                                        <option value="chi-merge">ChiMerge</option>
                                        <option value="k-means">k-Means</option>
                                    </select>
                                    <div class="algorithm-parameters">
                                        <template x-if="attr.algorithm.name === 'equal-freq'">
                                            <div class="ps-4">
                                                <div class="mb-3">
                                                    <label class="form-label">Number of Bins</label>
                                                    <input type="number" class="form-control" min="1" x-model="attr.algorithm.parameters.bins" />
                                                </div>
                                            </div>
                                        </template>
                                        <template x-if="attr.algorithm.name === 'equal-width'">
                                            <div class="ps-4">
                                                <div class="mb-3">
                                                    <label class="form-label">Number of Bins</label>
                                                    <input type="number" class="form-control" min="0.01" step="0.01" x-model="attr.algorithm.parameters.bins" />
                                                </div>
                                            </div>
                                        </template>
                                        <template x-if="attr.algorithm.name === 'chi-merge'">
                                            <div class="ps-4">
                                                <div class="mb-3">
                                                    <label class="form-label">Maximum Intervals</label>
                                                    <input type="number" class="form-control" min="1" x-model="attr.algorithm.parameters.max_interval" />
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label">Significance Level</label>
                                                    <input type="number" class="form-control" min="0.01" max="0.99" step="0.01" x-model="attr.algorithm.parameters.significance" />
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label">Labels (Target Attributes)</label>
                                                    <select class="form-select" multiple x-model="attr.algorithm.parameters.labels" x-multiselect :size="attr.related.length" style="height: auto">
                                                        <template x-for="attr in attr.related">
                                                            <option
                                                                :value="JSON.stringify({ attribute: attr.attribute, type: attr.type, qualifier: attr.qualifier })"
                                                                x-text="attr.attribute + '-' + attr.type + '-' + attr.qualifier"
                                                            ></option>
                                                        </template>
                                                    </select>
                                                </div>
                                            </div>
                                        </template>
                                        <template x-if="attr.algorithm.name === 'k-means'">
                                            <div class="ps-4">
                                                <div class="mb-3">
                                                    <label class="form-label">Number of Clusters</label>
                                                    <input type="number" class="form-control" min="2" x-model="attr.algorithm.parameters.clusters" />
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label">Labels (Target Attributes)</label>
                                                    <select class="form-select" multiple x-model="attr.algorithm.parameters.labels" x-multiselect :size="attr.related.length" style="height: auto">
                                                        <template x-for="attr in attr.related">
                                                            <option
                                                                :value="JSON.stringify({ attribute: attr.attribute, type: attr.type, qualifier: attr.qualifier })"
                                                                x-text="attr.attribute + '-' + attr.type + '-' + attr.qualifier"
                                                            ></option>
                                                        </template>
                                                    </select>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <h6 class="mb-2 text-secondary">Split Attributes</h6>
                                <div class="d-flex flex-column gap-2">
                                    <template x-for="rel in attr.related" :key="rel.attribute">
                                        <div class="d-flex align-items-center gap-2">
                                            <div class="form-check">
                                                <input
                                                    class="form-check-input"
                                                    type="checkbox"
                                                    :id="'split-' + attr.attribute + '-' + rel.attribute"
                                                    @change="
                                                        if ($event.target.checked) {
                                                            attr.split_attributes.push({
                                                                attribute: rel.attribute,
                                                                type: rel.type,
                                                                qualifier: rel.qualifier,
                                                                selected_value: null,
                                                                agg: rel.agg
                                                            });
                                                        } else {
                                                            attr.split_attributes = attr.split_attributes.filter(
                                                                s => !(s.attribute === rel.attribute && s.type === rel.type && s.qualifier === rel.qualifier)
                                                            );
                                                        }
                                                        "
                                                    :checked="attr.split_attributes.some(
                                                            s => s.attribute === rel.attribute && s.type === rel.type && s.qualifier === rel.qualifier
                                                        )"
                                                />
                                                <label class="form-check-label" :for="'split-' + attr.attribute + '-' + rel.attribute">
                                                    <span x-text="rel.attribute"></span>
                                                    -
                                                    <span x-text="rel.type"></span>
                                                    -
                                                    <span x-text="rel.qualifier"></span>
                                                </label>
                                            </div>
                                            <template x-if="attr.split_attributes.some(s => s.attribute === rel.attribute && s.type === rel.type && s.qualifier === rel.qualifier)">
                                                <select
                                                    class="form-select form-select-sm"
                                                    style="width: auto"
                                                    x-model="attr.split_attributes.find(s => s.attribute === rel.attribute && s.type === rel.type && s.qualifier === rel.qualifier).selected_value"
                                                >
                                                    <option value="">Value</option>
                                                    <template x-for="val in rel.vals" :key="val.value">
                                                        <option :value="val.value" x-text="val.value"></option>
                                                    </template>
                                                </select>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>

                <button type="submit" class="btn btn-primary mt-4">Start Discretization</button>
            </form>
        </div>
    </body>
</html>
